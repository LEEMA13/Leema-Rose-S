<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Page</title>
    <style>
      body {
        margin: 0;
        font-family: "Comic Sans MS", cursive;
        background: linear-gradient(to right, #ccf2d8, #a3c8f3);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 50px 20px;
      }

      .question-box {
        background-color: white;
        border: 3px solid black;
        border-radius: 10px;
        padding: 30px;
        width: 80%;
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 40px;
      }

      .options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        width: 80%;
        margin-bottom: 40px;
      }

      .option {
        background-color: white;
        border: 3px solid black;
        border-radius: 15px;
        padding: 20px;
        text-align: center;
        font-weight: bold;
        font-size: 18px;
        cursor: pointer;
        transition: 0.3s;
      }

      .option.correct {
        background-color: #c7f7c7;
        border-color: green;
      }

      .option.wrong {
        background-color: #f8c7c7;
        border-color: red;
      }

      .buttons {
        display: flex;
        gap: 30px;
        margin-top: 20px;
      }

      .btn {
        padding: 15px 30px;
        border: 3px dashed black;
        border-radius: 10px;
        background-color: white;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
      }

      .btn:hover {
        transform: scale(1.05);
      }

      .score {
        font-size: 22px;
        font-weight: bold;
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <div class="question-box" id="questionBox">Loading question...</div>

    <div class="options" id="optionsBox"></div>

    <div class="buttons">
      <button class="btn" onclick="goPrevious()">Previous</button>
      <a href="appans.html" class="btn" onclick="submitAnswer()">Answer</a>
      <button class="btn" onclick="goNext()">Next</button>
    </div>

    <div class="score" id="scoreBox"></div>

    <script>
      const questions = [
        {
          question: "What comes next in the series ? (2,6,12,20,30,?)",
          options: ["36", "42", "44", "46"],
          answer: 1,
        },
        {
          question:
            "If the cost of 5 pens is $15, what is the cost of 8 pens ?",
          options: ["$18", "$20", "$24", "$30"],
          answer: 2,
        },
        {
          question:
            "A train runs at 60km/h. How long wil it take to cover 180 km ?",
          options: ["2 hours", "3 hours", "3.5 hours", "4 hours"],
          answer: 1,
        },
        {
          question: "What is 25% of 480 ?",
          options: ["100", "110", "120", "130"],
          answer: 2,
        },
        {
          question: "Find the missing Numer:3,9,27,?,243",
          options: ["54", "72", "81", "108"],
          answer: 2,
        },
        {
          question:
            "If 12 workers can complete a task in 15 days, howv many workers are needed to complete it in 10 days ?",
          options: ["10", "14", "18", "24"],
          answer: 2,
        },
        {
          question:
            "A man sells an item for $240 and makes a 20% profit. What was the cost price ?",
          options: ["$180", "$190", "$200", "$220"],
          answer: 2,
        },
        {
          question: "What is the next number in the series ?",
          options: ["33", "35", "37", "38"],
          answer: 2,
        },
        {
          question:
            "If A=1,B=2,...,Z=26, then what is the value of the word 'CAB'?",
          options: ["6", "9", "12", "24"],
          answer: 3,
        },
        {
          question:
            "A shopkeeper offers a discount of 10% on a product with marked price $500. What is the selling price ?",
          options: ["$450", "$460", "$470", "$480"],
          answer: 0,
        },
      ];

      let currentQuestion = 0;
      let score = 0;
      let answeredQuestions = Array(questions.length).fill(null); // Store selected answer index

      function loadQuestion() {
        const q = questions[currentQuestion];
        const questionBox = document.getElementById("questionBox");
        const optionsBox = document.getElementById("optionsBox");
        const scoreBox = document.getElementById("scoreBox");

        questionBox.textContent = q.question;
        optionsBox.innerHTML = "";

        q.options.forEach((option, index) => {
          const div = document.createElement("div");
          div.classList.add("option");
          div.textContent = option;
          div.onclick = () => selectOption(div, index);
          optionsBox.appendChild(div);
        });

        scoreBox.textContent = "";
        showSelected();
      }

      function selectOption(element, index) {
        const q = questions[currentQuestion];
        const options = document.querySelectorAll(".option");

        if (answeredQuestions[currentQuestion] !== null) return; // prevent re-answers

        if (index === q.answer) {
          element.classList.add("correct");
          score++;
        } else {
          element.classList.add("wrong");
          options[q.answer].classList.add("correct"); // show correct
        }

        answeredQuestions[currentQuestion] = index;
      }

      function showSelected() {
        const selected = answeredQuestions[currentQuestion];
        if (selected === null) return;

        const options = document.querySelectorAll(".option");
        const correctIndex = questions[currentQuestion].answer;

        options[selected].classList.add(
          selected === correctIndex ? "correct" : "wrong"
        );
        if (selected !== correctIndex) {
          options[correctIndex].classList.add("correct");
        }
      }

      function goPrevious() {
        if (currentQuestion > 0) {
          currentQuestion--;
          loadQuestion();
        }
      }

      function goNext() {
        if (currentQuestion < questions.length - 1) {
          currentQuestion++;
          loadQuestion();
        } else {
          showFinalScore();
        }
      }

      function submitAnswer() {
        alert("This would show an answer explanation module in a real app.");
      }

      function showFinalScore() {
        document.getElementById("questionBox").textContent = "Quiz Completed!";
        document.getElementById("optionsBox").innerHTML = "";
        document.getElementById(
          "scoreBox"
        ).textContent = `Your Score: ${score} / ${questions.length}`;
      }

      // Initial load
      loadQuestion();
    </script>
  </body>
</html>
