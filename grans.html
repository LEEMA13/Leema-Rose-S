<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Correct Answer</title>
    <style>
      body {
        margin: 0;
        font-family: "Comic Sans MS", cursive;
        background: linear-gradient(to right, #ccf2d8, #a3c8f3);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      .header {
        background-color: white;
        border: 3px solid black;
        border-radius: 10px;
        padding: 20px 40px;
        font-size: 28px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 50px;
      }

      .answer-box {
        background-color: white;
        border: 3px solid black;
        border-radius: 10px;
        padding: 20px 60px;
        font-size: 26px;
        font-weight: bold;
        text-align: center;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="header">The Correct Answer Is</div>
    <div class="answer-box" id="answer">She doesn't like pizza</div>
    <div class="answer-box" id="answer">Goes</div>
    <div class="answer-box" id="answer">He and I are friends</div>
    <div class="answer-box" id="answer">Since</div>
    <div class="answer-box" id="answer">It's raining outside</div>
    <div class="answer-box" id="answer">Better</div>
    <div class="answer-box" id="answer">Were</div>
    <div class="answer-box" id="answer">
      A delicious meal was cooked by the chef
    </div>
    <div class="answer-box" id="answer">An</div>
    <div class="answer-box" id="answer">Children</div>
  </body>
</html>
